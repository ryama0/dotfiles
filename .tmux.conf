#日本語環境用
if-shell 'test $(echo "$(tmux -V | sed -E -e "s/[^0-9]+([0-9]+\.?[0-9]*).*/\1/g" |  awk \{print\ \$1\}) <= 2.2" | bc) -ne 0' \
  '\
  setw -g utf8 on;\
  set -g status-utf8 on;\
  set-window-option -g utf8 on;\
  '

setw -g mode-keys vi
#status
set -g status-interval 10
set-option -g status on
set -g status-style "fg=white,bg=colour236"
set-option -g status-left "#[fg=white,bg=colour25][#{session_name}]#[default] "
set-option -g window-status-format " #I:#W#{?window_flags,#{window_flags}, } "
set-option -g window-status-current-format "#[fg=white,bg=colour239] #I:#W#{?window_flags,#{window_flags}, } #[default]"
set-option -g status-right-length 60
set-option -g status-right "%Y-%m-%d(%a) %H:%M #[fg=white,bg=colour25] #{user}@#{=21:host} #[default]"


set -g default-command $SHELL

bind c new-window -c '#{pane_current_path}'
bind '"' split-window -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'

#escキー
set -s escape-time 0

# True Color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,alacritty:RGB"

# OS
source-file ~/.tmux.d/common/main.conf
if-shell 'uname | grep -q Darwin' 'source-file ~/.tmux.d/macOS/main.conf' ''
if-shell 'uname | grep -q Linux' 'source-file ~/.tmux.d/linux/main.conf' ''
if-shell "uname -r | grep -i 'microsoft'" 'source-file ~/.tmux/wsl/main.conf' ''
