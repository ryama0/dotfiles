setw -g mode-keys vi

set -g default-command $SHELL

#escキー
set -s escape-time 0

# コピーモードの選択範囲の色
set -w -g mode-style "fg=white,bg=colour67"

source-file ~/.tmux/common/shortcut.conf
source-file ~/.tmux/common/truecolor.conf
source-file ~/.tmux/common/status.conf
source-file ~/.tmux/common/mouse.conf
